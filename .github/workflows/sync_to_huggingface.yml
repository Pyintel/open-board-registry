name: Sync Dataset to Hugging Face

on:
  push:
    branches:
      - master
    paths:
      - 'boards.json'
      - 'tools/**'
      - '.github/workflows/sync_to_huggingface.yml'
  workflow_dispatch:

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub

      - name: Compile Parquet & Sync to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python tools/sync_hf_dataset.py
